[project]
name = "ina-dc-ows"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datacube-ows[webserver] @ git+https://github.com/willjnz/datacube-ows.git@fix-low-res-product",
    "gunicorn",
    "psycopg2",
    "datacube==1.9.18",
    "Pillow",
    "rasterio",
    "netCDF4",
    "gdal==3.13",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ows_config"]

[tool.hatch.metadata]
allow-direct-references = true